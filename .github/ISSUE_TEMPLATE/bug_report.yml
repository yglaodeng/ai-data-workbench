name: Bug report
description: Report a reproducible problem using synthetic or redacted data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach real business files, credentials, customer data, or production records.
  - type: textarea
    id: input
    attributes:
      label: Synthetic input shape
      description: File type, sheets, columns, and a minimal redacted example.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Natural-language goal and steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and browser
    validations:
      required: true
